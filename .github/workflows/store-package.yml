name: Build Microsoft Store Package
run-name: Store ${{ inputs.version }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Store package version (for example 0.1.2; revision is always zero)
        required: true
        default: '0.1.3'
        type: string
      source_ref:
        description: Branch, tag or commit containing the desktop application
        required: true
        default: codex/windows-installer
        type: string
      submit_to_store:
        description: Upload the package and commit the submission to Microsoft Store certification
        required: true
        default: true
        type: boolean
      resume_submission:
        description: Only inspect and finish the existing submission, without rebuilding or uploading
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  package:
    if: ${{ !inputs.resume_submission }}
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      STORE_VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:STORE_VERSION_INPUT -notmatch '^v?(\d+)\.(\d+)\.(\d+)(?:\.0)?$') {
            throw 'Use major.minor.patch, optionally prefixed with v or followed by .0.'
          }
          $parts = @($Matches[1], $Matches[2], $Matches[3])
          foreach ($part in $parts) {
            if ([long]$part -gt 65535) { throw 'Each version component must be at most 65535.' }
          }
          $version = ($parts | ForEach-Object { [int]$_ }) -join '.'
          "STORE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Checkout selected source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate release notes
        shell: pwsh
        run: |
          $path = "release-notes/$env:STORE_VERSION.json"
          $notes = Get-Content -LiteralPath $path -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          if (!$notes.ContainsKey('en-us')) { throw 'Release notes require an en-us fallback.' }
          foreach ($text in $notes.Values) {
            if ($text -isnot [string] -or [string]::IsNullOrWhiteSpace($text) -or $text.Length -gt 1500) {
              throw 'Each release note must contain 1-1500 characters.'
            }
          }
          New-Item -ItemType Directory -Force publish/msix | Out-Null
          Copy-Item -LiteralPath $path -Destination publish/msix/release-notes.json

      - name: Run tests
        shell: pwsh
        run: dotnet test Frpm.slnx --configuration Release --verbosity minimal

      - name: Generate Windows icon
        shell: pwsh
        run: '& installer/windows/New-FrpmIcon.ps1 -OutputPath src/Frpm.Desktop/Assets/frpm.ico'

      - name: Publish desktop application
        shell: pwsh
        run: dotnet publish src/Frpm.Desktop/Frpm.Desktop.csproj --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 --self-contained true -p:Version=$env:STORE_VERSION --output publish/win-x64/desktop

      - name: Build Store upload package
        shell: pwsh
        run: |
          $makeAppx = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter makeappx.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'MakeAppx.exe was not found.' }
          & installer/msix/New-FrpmMsix.ps1 -SourceDirectory publish/win-x64 -OutputDirectory publish/msix -Version $env:STORE_VERSION -MakeAppxPath $makeAppx.FullName

      - name: Upload Store submission package
        uses: actions/upload-artifact@v4
        with:
          name: frpm-${{ env.STORE_VERSION }}-win-x64-msixupload
          path: |
            publish/msix/*.msixupload
            publish/msix/release-notes.json
          if-no-files-found: error
          retention-days: 30

      - name: Record build details
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          @"
          ## Microsoft Store package
          - Package version: $env:STORE_VERSION.0
          - Source commit: $commit
          - Download the msixupload artifact from this run and upload it to Partner Center.
          - No Git tag or GitHub Release is created by this workflow.
          "@ >> $env:GITHUB_STEP_SUMMARY

  submit:
    name: Upload and submit to Microsoft Store
    needs: package
    if: ${{ always() && inputs.submit_to_store && (needs.package.result == 'success' || inputs.resume_submission) }}
    runs-on: windows-latest
    timeout-minutes: 30
    # Credentials are isolated from the selected source code and its build scripts.
    concurrency:
      group: microsoft-store-submission-9NQHDN7WR30L
      cancel-in-progress: false
    steps:
      - name: Check Store credentials
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($name in @('TENANT_ID', 'CLIENT_ID', 'CLIENT_SECRET', 'SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing Store credential: $name. Configure the repository Actions secrets."
            }
          }

      - name: Download package from this build
        if: ${{ !inputs.resume_submission }}
        uses: actions/download-artifact@v4
        with:
          pattern: frpm-*-win-x64-msixupload
          path: store-package
          merge-multiple: true

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Authenticate with Partner Center
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET

      - name: Upload package and commit submission
        if: ${{ !inputs.resume_submission }}
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath store-package -Filter '*.msixupload' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Store upload package.' }
          msstore publish $packages[0].FullName -id 9NQHDN7WR30L --noCommit
          if ($LASTEXITCODE -ne 0) { throw "Store submission failed (exit $LASTEXITCODE)." }
          $notes = Get-Content -LiteralPath store-package/release-notes.json -Raw -Encoding utf8 | ConvertFrom-Json -AsHashtable
          $raw = msstore submission get 9NQHDN7WR30L
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read Store submission.' }
          $submission = ($raw -join "`n") | ConvertFrom-Json -AsHashtable
          if (!$submission.Listings -or $submission.Listings.Count -eq 0) { throw 'No Store listings found.' }
          foreach ($language in $submission.Listings.Keys) {
            $text = if ($notes.ContainsKey($language)) { $notes[$language] } else { $notes['en-us'] }
            if ([string]::IsNullOrWhiteSpace($text) -or $text.Length -gt 1500) { throw "Invalid notes for $language." }
            $submission.Listings[$language].BaseListing.ReleaseNotes = $text
            Write-Output "Updated release notes: $language"
          }
          msstore submission update 9NQHDN7WR30L ($submission | ConvertTo-Json -Depth 100 -Compress)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot update Store release notes.' }
          msstore submission publish 9NQHDN7WR30L
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit Store submission.' }
      - name: Confirm submission enters certification
        shell: pwsh
        run: |
          $deadline = [DateTime]::UtcNow.AddMinutes(20)
          $committed = $false
          while ([DateTime]::UtcNow -lt $deadline) {
            $raw = msstore submission get 9NQHDN7WR30L
            if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve submission status.' }
            $submission = ($raw -join "`n") | ConvertFrom-Json
            $status = $submission.Status
            Write-Output "Submission $($submission.Id): $status"
            if ($status -in @('Certification', 'Release', 'PrePublishing', 'Publishing', 'Published', 'PendingPublication', 'ReadyForRelease')) {
              "Submission $($submission.Id) accepted: $status. Microsoft controls certification and Store availability." >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            if ($status -match 'Failed|Canceled|Cancelled|Attention') {
              $details = $submission.StatusDetails | ConvertTo-Json -Depth 20
              throw "Store submission failed: $status. $details"
            }
            if ($status -eq 'PendingCommit' -and !$committed) {
              msstore submission publish 9NQHDN7WR30L
              if ($LASTEXITCODE -ne 0) { throw 'Cannot commit existing submission.' }
              $committed = $true
            }
            Start-Sleep -Seconds 30
          }
          throw 'Store did not enter certification within 20 minutes. Inspect Partner Center and resume this submission; do not upload a duplicate.'
