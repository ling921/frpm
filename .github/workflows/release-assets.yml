name: Publish Native Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to which the native packages are uploaded
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-assets-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    name: Build and upload native packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        run: >-
          dotnet publish src/Frpm/Frpm.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --property:PublishNativeRelease=true
          --output publish/${{ matrix.rid }}/FRPM

      - name: Add startup helper
        shell: bash
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            printf '@echo off\r\nset "ASPNETCORE_URLS=http://+:8080"\r\nFrpm.exe\r\n' > publish/${{ matrix.rid }}/FRPM/start.bat
          else
            printf '#!/usr/bin/env sh\nset -eu\nexport ASPNETCORE_URLS="${ASPNETCORE_URLS:-http://+:8080}"\nexec ./Frpm\n' > publish/${{ matrix.rid }}/FRPM/start.sh
            chmod +x publish/${{ matrix.rid }}/FRPM/start.sh
          fi

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            (cd publish/${{ matrix.rid }} && zip -qr ../../dist/frpm-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.zip FRPM)
          else
            tar -C publish/${{ matrix.rid }} -czf dist/frpm-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.tar.gz FRPM
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true
