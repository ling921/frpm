name: Publish Native Release Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to which the native packages are uploaded
        required: true
        type: string
      source_ref:
        description: Branch, tag, or commit to build when dispatching manually
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-release-assets-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  SOURCE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.source_ref }}

jobs:
  publish:
    name: Build and upload native packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            archive: zip
          - rid: linux-x64
            archive: tar.gz
          - rid: linux-arm64
            archive: tar.gz

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained application
        run: >-
          dotnet publish src/Frpm/Frpm.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --property:PublishNativeRelease=true
          --output publish/${{ matrix.rid }}/FRPM

      - name: Publish tray application
        run: >-
          dotnet publish src/Frpm.Tray/Frpm.Tray.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --property:PublishSingleFile=true
          --property:IncludeNativeLibrariesForSelfExtract=true
          --output publish/${{ matrix.rid }}/FRPM/tray

      - name: Add startup helper
        shell: bash
        run: |
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            printf '@echo off\r\nFrpm.exe\r\n' > publish/${{ matrix.rid }}/FRPM/start.bat
          else
            printf '#!/usr/bin/env sh\nset -eu\nexec ./Frpm\n' > publish/${{ matrix.rid }}/FRPM/start.sh
            chmod +x publish/${{ matrix.rid }}/FRPM/start.sh
            mkdir -p publish/${{ matrix.rid }}/FRPM/systemd
            cp installer/linux/frpm.service publish/${{ matrix.rid }}/FRPM/systemd/frpm.service
            cp installer/linux/install-systemd.sh publish/${{ matrix.rid }}/FRPM/systemd/install-systemd.sh
            chmod +x publish/${{ matrix.rid }}/FRPM/systemd/install-systemd.sh
          fi

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            (cd publish/${{ matrix.rid }} && zip -qr ../../dist/frpm-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.zip FRPM)
          else
            tar -C publish/${{ matrix.rid }} -czf dist/frpm-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.tar.gz FRPM
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          fail_on_unmatched_files: true

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish FRPM service and tray application
        shell: pwsh
        run: |
          dotnet publish src/Frpm/Frpm.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishNativeRelease=true --output publish/win-x64/server
          dotnet publish src/Frpm.Tray/Frpm.Tray.csproj --configuration Release --runtime win-x64 --self-contained true --property:PublishSingleFile=true --property:IncludeNativeLibrariesForSelfExtract=true --output publish/win-x64/tray

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $sourceDir = Join-Path $env:GITHUB_WORKSPACE 'publish\win-x64'
          & $compiler "/DMyAppVersion=${env:RELEASE_TAG}" "/DSourceDir=$sourceDir" installer/windows/FRPM.iss

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/FRPM-Setup-*-win-x64.exe
          fail_on_unmatched_files: true
