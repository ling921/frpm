openapi: 3.0.1
info:
  title: ME Frp 5.0 开放 API
  description: 此文件由 Apifox 文档站点 5442083 导出，作为 FRPM 的本地接口契约快照。
  version: 1.0.0
  x-apifox-site-id: 5442083
tags:
  - name: 新版本
paths:
  /public/statistics:
    get:
      summary: 统计信息
      deprecated: false
      description: 获取用户数量、节点数量、隧道数量、已承载流量
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: object
                    properties:
                      users:
                        type: integer
                        title: 用户数量
                      nodes:
                        type: integer
                        title: 节点数量
                      proxies:
                        type: integer
                        title: 隧道数量
                      traffic:
                        type: integer
                        title: 已承载流量
                    required:
                      - users
                      - nodes
                      - proxies
                      - traffic
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              example:
                code: 200
                data:
                  users: 44984
                  nodes: 57
                  proxies: 4696
                  traffic: 76852995417754
                message: 获取统计信息成功
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              example:
                code: 500
                data: null
                message: 获取统计信息失败
          headers: {}
      security: []
  /public/store/products:
    get:
      summary: 获取商城商品
      deprecated: false
      description: 获取商城商品
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          description: 类型
                          type: string
                        name:
                          description: 商品名
                          type: string
                        price:
                          description: 价格
                          type: number
                        unit:
                          description: 单位
                          type: string
                        description:
                          description: 使用 | 分隔行
                          type: string
                          title: 商品介绍
                        enabled:
                          description: 是否启用
                          type: boolean
                        discountEnabled:
                          description: 是否有折扣
                          type: boolean
                        discountPrice:
                          type: number
                          description: 折扣价格
                        discountStartTime:
                          description: 折扣开始时间
                          type: integer
                        discountEndTime:
                          description: 折扣结束时间
                          type: integer
                        currentPrice:
                          description: 现在的价格
                          type: number
                        isDiscountActive:
                          description: 折扣是否可用
                          type: boolean
                        discountRemainingSeconds:
                          description: 折扣剩余时间
                          type: integer
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              example:
                code: 200
                data:
                  - type: traffic
                    name: 流量包
                    price: 0.1
                    unit: GB
                    description: 无限期有效|无额外限速|支持所有节点
                    enabled: true
                    discountEnabled: false
                    discountPrice: 0
                    discountStartTime: 0
                    discountEndTime: 0
                    currentPrice: 0.1
                    isDiscountActive: false
                    discountRemainingSeconds: 0
                message: 获取成功
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                  code:
                    type: integer
                    title: 状态码
                required:
                  - code
                  - data
                  - message
          headers: {}
      security: []
  /public/register/emailCode:
    post:
      summary: 获取邮件注册验证码
      deprecated: false
      description: >-
        >
        此端点需要进行人机验证传参，详见[此文档](%E6%9C%89%E5%85%B3%E4%BA%BA%E6%9C%BA%E9%AA%8C%E8%AF%81%E7%9A%84%E6%8F%90%E9%86%92-6889302m0)


        获取注册用的邮箱验证码
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  title: 邮箱
                captchaToken:
                  type: string
                  title: 验证码 token
              required:
                - email
                - captchaToken
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                  code:
                    type: integer
                    title: 状态码
                required:
                  - code
                  - data
                  - message
              examples:
                '1':
                  summary: 成功示例
                  value:
                    data: null
                    message: 验证码已发送, 请检查邮箱
                    code: 200
                '2':
                  summary: 数据不全
                  value:
                    data: null
                    message: 无效的请求数据
                    code: 400
                '3':
                  summary: 邮箱不规范
                  value:
                    data: null
                    message: 邮箱格式错误, 请检查并重试
                    code: 400
                '4':
                  summary: 禁止提供商
                  value:
                    data: null
                    message: 此邮件提供商已被系统封禁, 请更换
                    code: 400
                '5':
                  summary: 重复邮箱
                  value:
                    data: null
                    message: 不允许使用同一个邮箱注册多个账户
                    code: 400
                '6':
                  summary: 发送失败
                  value:
                    data: null
                    message: 验证码发送失败, 请稍后再试
                    code: 500
                '7':
                  summary: 禁止注册
                  value:
                    data: null
                    message: 注册功能已关闭, 请联系管理员
                    code: 403
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              examples:
                '8':
                  summary: 缺少验证码
                  value:
                    code: 400
                    data: null
                    message: 缺少验证码
                '9':
                  summary: 无效的请求数据
                  value:
                    code: 400
                    data: null
                    message: 无效的请求数据
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              example:
                code: 404
                data: null
                message: 用户获取失败, 请检查用户名或邮箱是否正确
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
          headers: {}
      security: []
  /public/register:
    post:
      summary: 注册账户
      deprecated: false
      description: 使用邮箱注册账户，需要先获取邮件注册验证码
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  title: 用户名
                email:
                  type: string
                  title: 邮箱
                emailCode:
                  type: string
                  title: 验证码
                  description: 使用上一个接口获取
                password:
                  type: string
                  title: 密码
                  description: 密码必须包含大小写字母和数字, 长度为8-16位
              required:
                - username
                - email
                - emailCode
                - password
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
              examples:
                '1':
                  summary: 成功示例
                  value:
                    data: null
                    message: 已成功注册, 欢迎使用
                    code: 200
                '2':
                  summary: 数据不全
                  value:
                    data: null
                    message: 无效的请求数据
                    code: 400
                '3':
                  summary: 密码不规范
                  value:
                    data: null
                    message: 密码必须包含大小写字母和数字, 长度为8-16位
                    code: 400
                '4':
                  summary: 邮箱不规范
                  value:
                    data: null
                    message: 邮箱格式错误, 请检查并重试
                    code: 400
                '5':
                  summary: 用户名不规范
                  value:
                    data: null
                    message: 用户名必须为4-16个字符, 且只能包含字母、数字和下划线
                    code: 400
                '6':
                  summary: 用户名已存在
                  value:
                    data: null
                    message: 用户名已存在, 请更换用户名
                    code: 400
                '7':
                  summary: 邮箱验证码错误
                  value:
                    data: null
                    message: 验证码错误, 请检查并重试
                    code: 400
                '8':
                  summary: 获取设置失败
                  value:
                    data: null
                    message: 获取设置失败
                    code: 500
                '9':
                  summary: 密码加密失败
                  value:
                    data: null
                    message: 注册失败, 密码处理错误, 请联系管理员
                    code: 500
                '10':
                  summary: 用户组错误
                  value:
                    data: null
                    message: 注册失败, 用户组配置错误
                    code: 500
                '11':
                  summary: 禁止注册
                  value:
                    data: null
                    message: 注册功能已关闭, 请联系管理员
                    code: 403
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
          headers: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
          headers: {}
        '500':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    title: 状态码
                  data:
                    type: 'null'
                    title: 数据
                  message:
                    type: string
                    title: 提示
                required:
                  - code
                  - data
                  - message
          headers: {}
      security: []
