components:
  schemas:
    userInfo:
      type: object
      properties:
        userId:
          type: integer
          title: 用户 ID
        username:
          type: string
          title: 用户名
        email:
          type: string
          title: 邮箱
        group:
          type: string
          title: 用户组 ID
        isRealname:
          type: boolean
          title: 是否实名
        inBound:
          type: integer
          title: 入站带宽
        maxProxies:
          type: integer
          title: 最大隧道数
        outBound:
          type: integer
          title: 出站带宽
        regTime:
          type: integer
          title: 注册时间
        status:
          type: integer
          title: 账户状态
          description: 0-正常 1-封禁 2-流量超限
        todaySigned:
          type: boolean
          title: 签到状态
          description: 'true: 已签到'
        traffic:
          type: integer
          title: 流量
        vipExpireTime:
          type: integer
          title: VIP 过期时间
          description: 当前用户是 VIP 才会返回，早期用户可能没有该字段
        usedProxies:
          type: integer
          title: 已使用隧道数
        friendlyGroup:
          type: string
          title: 语义化用户组
      required:
        - email
        - friendlyGroup
        - group
        - inBound
        - isRealname
        - maxProxies
        - outBound
        - regTime
        - status
        - traffic
        - usedProxies
        - userId
        - username
        - todaySigned
      title: 用户信息
    proxy:
      type: object
      properties:
        proxyId:
          type: integer
          title: 隧道 ID
        username:
          type: string
          title: 隧道所属用户名
        proxyName:
          type: string
          title: 隧道名
        proxyType:
          description: 隧道类型（tcp/udp/http/https）
          type: string
          title: 隧道协议
        isBanned:
          description: 是否被封禁
          type: boolean
          title: 是否被封禁
        isDisabled:
          description: 是否被手动禁用
          type: boolean
          title: 是否被禁用
        localIp:
          description: 本地监听 IP
          type: string
          title: 本地地址
        localPort:
          description: 本地端口
          type: integer
          title: 本地端口
        remotePort:
          description: 远程端口
          type: integer
          title: 远程端口
        nodeId:
          description: 所属节点 ID
          type: integer
          title: 节点 ID
        runId:
          description: 格式：`<访问令牌>-<运行 ID>`，不存在即为`""`
          type: string
          title: 上次启动的运行 ID
        isOnline:
          description: 当前在线状态
          type: boolean
          title: 是否在线
        domain:
          description: 列表被文本化，需要额外处理，如[\"mefrp.com\"]
          type: string
          title: 远程节点域名
        lastStartTime:
          description: 不存在即为0
          type: integer
          title: 上次上线时间
        lastCloseTime:
          description: 不存在即为0
          type: integer
          title: 上次下线时间
        clientVersion:
          description: 客户端版本号
          type: string
          title: 客户端版本
        proxyProtocolVersion:
          description: 代理协议版本
          type: string
        useEncryption:
          description: 是否启用传输加密
          type: boolean
          title: 数据是否加密
        useCompression:
          description: 是否启用传输压缩
          type: boolean
          title: 数据是否压缩
        location:
          description: 地理位置标签
          type: string
          title: Location 参数
        accessKey:
          type: string
          title: 访问密钥
          description: 访问密钥已回归
        hostHeaderRewrite:
          description: 不存在即为空（`""`）
          type: string
          title: 请求头重写
        httpPlugin:
          description: HTTP 插件名称
          type: string
        crtPath:
          description: TLS 证书路径
          type: string
        keyPath:
          description: TLS 私钥路径
          type: string
        requestHeaders:
          type: object
          properties: {}
          description: 向内网服务回源时添加的请求头
        httpUser:
          description: HTTP Basic Auth 用户名
          type: string
        httpPassword:
          description: HTTP Basic Auth 密码
          type: string
      required:
        - proxyId
        - username
        - proxyName
        - proxyType
        - isBanned
        - isDisabled
        - localIp
        - localPort
        - remotePort
        - nodeId
        - runId
        - isOnline
        - domain
        - lastStartTime
        - lastCloseTime
        - clientVersion
        - proxyProtocolVersion
        - useEncryption
        - useCompression
        - location
        - accessKey
        - hostHeaderRewrite
        - httpPlugin
        - crtPath
        - keyPath
        - requestHeaders
        - httpUser
        - httpPassword
      title: 隧道数据
  responses:
    鉴权失败:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                title: 状态码
                const: 401
              data:
                type: 'null'
                title: 数据
              message:
                type: string
                title: 消息
                const: 用户 Token 为空或格式错误
            required:
              - code
              - data
              - message
          examples:
            异常示例:
              summary: 异常示例
              value:
                code: 401
                data: null
                message: 用户 Token 为空或格式错误
    参数有误:
      description: ''
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                title: 状态码
                const: 401
              data:
                type: 'null'
                title: 数据
              message:
                type: string
                title: 消息
                const: 无效的请求数据
            required:
              - code
              - data
              - message
          examples:
            异常示例:
              summary: 异常示例
              value:
                code: 400
                data: null
                message: 无效的请求数据
  securitySchemes:
    用户 Token:
      type: http
      scheme: bearer
servers:
  - url: https://api.mefrp.com/api
    description: 正式环境
security: []
