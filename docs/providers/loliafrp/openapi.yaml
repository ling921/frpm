                      has_beian: false
                      expires_at: '2026-04-01T23:07:09+08:00'
                      created_at: '2026-03-31T23:07:09+08:00'
                  total: 1
                  page: 1
                  limit: 10
          headers: {}
      security: []
    post:
      summary: 添加域名
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example:
              domain: pysio.online
              remark: 测试
        required: true
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      created_at:
                        type: string
                      domain:
                        type: string
                      domain_connect_url:
                        type: string
                      expires_at:
                        type: string
                      id:
                        type: integer
                      status:
                        type: string
                      verification_subdomain:
                        type: string
                      verification_token:
                        type: string
                    required:
                      - created_at
                      - domain
                      - domain_connect_url
                      - expires_at
                      - id
                      - status
                      - verification_subdomain
                      - verification_token
                required:
                  - code
                  - msg
                  - data
              example:
                code: 201
                msg: 域名添加成功
                data:
                  created_at: '2026-03-31T23:53:12+08:00'
