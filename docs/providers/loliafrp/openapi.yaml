openapi: 3.0.1
info:
  title: 洛链映射 API
  description: ''
  version: 1.0.0
tags: []
paths:
  /user/info:
    get:
      summary: 获取用户信息
      deprecated: false
      description: ''
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      avatar:
                        type: string
                      bandwidth_limit:
                        type: integer
                      created_at:
                        type: string
                      email:
                        type: string
                      has_kyc:
                        type: boolean
                      id:
                        type: integer
                      is_banned:
                        type: boolean
                      kyc_count:
                        type: integer
                      kyc_status:
                        type: string
                      max_tunnel_count:
                        type: integer
                      role:
                        type: string
                      today_checked:
                        type: boolean
                      traffic_limit:
                        $ref: '#/components/schemas/long'
                      traffic_used:
                        $ref: '#/components/schemas/long'
                      username:
                        type: string
                      is_baned:
                        type: boolean
                    required:
                      - avatar
                      - bandwidth_limit
                      - created_at
                      - email
                      - has_kyc
                      - id
                      - is_banned
                      - kyc_count
                      - kyc_status
                      - max_tunnel_count
                      - role
                      - today_checked
                      - traffic_limit
                      - traffic_used
                      - username
                      - is_baned
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: 获取成功
                data:
                  avatar: >-
                    https://cn.cravatar.com/avatar/e4d49a63f94851590b66ea8b898556d5?s=180&d=mp&r=g
                  bandwidth_limit: 10
                  created_at: '2025-11-22T01:08:11.376398+08:00'
                  email: 114514@qq.com
                  has_kyc: false
                  id: 1
                  is_banned: false
                  kyc_count: 0
                  kyc_status: certifying
                  max_tunnel_count: 10
                  role: admin
                  today_checked: false
                  traffic_limit: 526133493760
                  traffic_used: 0
                  username: test
          headers: {}
      security: []
  /user/traffic/tunnel/{tunnel_id}:
    get:
      summary: 获取单个隧道的实时数据
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: tunnel_id
          in: path
          description: ''
          required: true
          example: 946978624732161e390349
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      tunnel_name:
                        type: string
                      node_id:
                        type: string
                      traffic_in:
                        $ref: '#/components/schemas/long'
                      traffic_out:
                        $ref: '#/components/schemas/long'
                      total_traffic:
                        $ref: '#/components/schemas/long'
                      connections:
                        type: integer
                      last_update:
                        type: string
                    required:
                      - tunnel_name
                      - node_id
                      - traffic_in
                      - traffic_out
                      - total_traffic
                      - connections
                      - last_update
                required:
                  - status
                  - msg
                  - data
          headers: {}
      security: []
  /user/traffic/stats:
    get:
      summary: 获取用户流量统计信息
      deprecated: false
      description: ''
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      user_id:
                        type: string
                      username:
                        type: string
                      traffic_limit:
                        $ref: '#/components/schemas/long'
                      traffic_used:
                        $ref: '#/components/schemas/long'
                      traffic_remaining:
                        $ref: '#/components/schemas/long'
                    required:
                      - user_id
                      - username
                      - traffic_limit
                      - traffic_used
                      - traffic_remaining
                required:
                  - status
                  - msg
                  - data
          headers: {}
      security: []
  /user/traffic/daily:
    get:
      summary: 获取每日流量统计（包含各隧道流量）
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: days
          in: query
          description: ''
          required: false
          example: '7'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      daily_stats:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            tunnel_stats:
                              type: array
                              items:
                                type: string
                            total_in:
                              $ref: '#/components/schemas/long'
                            total_out:
                              $ref: '#/components/schemas/long'
                            total_traffic:
                              $ref: '#/components/schemas/long'
                          required:
                            - date
                            - tunnel_stats
                            - total_in
                            - total_out
                            - total_traffic
                      days:
                        type: integer
                      user_id:
                        type: string
                    required:
                      - daily_stats
                      - days
                      - user_id
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: 获取成功
                data:
                  daily_stats:
                    - date: '2026-02-10T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-11T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-12T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-13T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-14T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-15T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                    - date: '2026-02-16T00:00:00Z'
                      tunnel_stats: []
                      total_in: 0
                      total_out: 0
                      total_traffic: 0
                  days: 7
                  user_id: '1'
          headers: {}
      security: []
  /user/traffic/tunnels:
    get:
      summary: 获取用户各隧道的流量信息
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: days
          in: query
          description: ''
          required: false
          example: '2'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                      days:
                        type: integer
                      end_time:
                        type: string
                      start_time:
                        type: string
                      tunnels:
                        type: array
                        items:
                          type: object
                          properties:
                            tunnel_name:
                              type: string
                            node_id:
                              type: string
                            total_in:
                              $ref: '#/components/schemas/long'
                            total_out:
                              $ref: '#/components/schemas/long'
                            total_traffic:
                              $ref: '#/components/schemas/long'
                            max_connections:
                              type: integer
                            remark:
                              type: string
                          required:
                            - tunnel_name
                            - node_id
                            - total_in
                            - total_out
                            - total_traffic
                            - max_connections
                            - remark
                      user_id:
                        type: string
                    required:
                      - count
                      - days
                      - end_time
                      - start_time
                      - tunnels
                      - user_id
                required:
                  - code
                  - msg
                  - data
          headers: {}
      security: []
  /user/tunnel:
    post:
      summary: 创建隧道
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_id:
                  type: integer
                type:
                  type: string
                local_ip:
                  type: string
                local_port:
                  type: integer
                remote_port:
                  type: integer
                custom_domain:
                  type: string
                remark:
                  type: string
              required:
                - node_id
                - type
                - local_ip
                - local_port
                - remote_port
                - custom_domain
                - remark
            example:
              node_id: 1
              type: tcp
              local_ip: 127.0.0.1
              local_port: 11451
              remote_port: 11451
              custom_domain: ''
              remark: Test-C
        required: true
      responses:
        '401':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                required:
                  - code
                  - msg
          headers: {}
      security: []
    get:
      summary: 获取用户隧道列表
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: page
          in: query
          description: ''
          required: false
          example: '1'
          schema:
            type: string
        - name: limit
          in: query
          description: ''
          required: false
          example: '10'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      limit:
                        type: integer
                      list:
                        type: array
                        items:
                          type: object
                          properties:
                            auto_tls:
                              type: boolean
                            bandwidth_limit:
                              type: integer
                            client_version:
                              type: string
                            custom_domain:
                              type: string
                            id:
                              type: integer
                            local_ip:
                              type: string
                            local_port:
                              type: integer
                            name:
                              type: string
                            node_address:
                              type: string
                            node_id:
                              type: integer
                            node_name:
                              type: string
                            remark:
                              type: string
                            remote_port:
                              type: integer
                            status:
                              type: string
                            type:
                              type: string
                          required:
                            - bandwidth_limit
                            - custom_domain
                            - id
                            - local_ip
                            - local_port
                            - name
                            - node_id
                            - remark
                            - remote_port
                            - status
                            - type
                      page:
                        type: integer
                      total:
                        type: integer
                      total_page:
                        type: integer
                    required:
                      - limit
                      - list
                      - page
                      - total
                      - total_page
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: 获取成功
                data:
                  limit: 10
                  list:
                    - auto_tls: true
                      bandwidth_limit: 10
                      client_version: ''
                      custom_domain: pysio.tel
                      id: 20
                      local_ip: 127.0.0.1
                      local_port: 8081
                      name: 4861097abed145b78cd7caadb9433239
                      node_address: 127.0.0.1
                      node_id: 1
                      node_name: Test-node
                      remark: '114514'
                      remote_port: 80
                      status: inactive
                      type: http
                  page: 1
                  total: 5
                  total_page: 1
          headers: {}
      security: []
  /user/tunnel/{tunnel_name}:
    get:
      summary: 获取隧道详情
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: tunnel_name
          in: path
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      bandwidth_limit:
                        type: integer
                      client_version:
                        type: string
                      created_at:
                        type: string
                      custom_domain:
                        type: string
                      id:
                        type: integer
                      local_ip:
                        type: string
                      local_port:
                        type: integer
                      name:
                        type: string
                      node_address:
                        type: string
                      node_id:
                        type: integer
                      node_name:
                        type: string
                      remark:
                        type: string
                      remote_port:
                        type: integer
                      status:
                        type: string
                      tunnel_token:
                        type: string
                      type:
                        type: string
                      auto_tls:
                        type: boolean
                    required:
                      - bandwidth_limit
                      - client_version
                      - created_at
                      - custom_domain
                      - id
                      - local_ip
                      - local_port
                      - name
                      - node_address
                      - node_id
                      - node_name
                      - remark
                      - remote_port
                      - status
                      - tunnel_token
                      - type
                      - auto_tls
                required:
                  - code
                  - msg
                  - data
          headers: {}
      security: []
    delete:
      summary: 删除隧道
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: tunnel_name
          in: path
          description: ''
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                      - message
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: 删除成功
                data:
                  message: 隧道已删除
          headers: {}
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - data
              example:
                code: 400
                msg: 隧道名称不能为空
                data: null
          headers: {}
        '404':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - data
              example:
                code: 404
                msg: 隧道不存在
                data: null
          headers: {}
      security: []
    put:
      summary: 编辑隧道信息
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: tunnel_name
          in: path
          description: ''
          required: true
          example: 4861097abed145b78cd7caadb9433239
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
            example:
              local_ip: 127.0.0.1
              local_port: 8080
              custom_domain: demo.example.com
              remark: my tunnel
              config:
                auto_tls: true
                proxy_protocol_version: v2
                protocol: tcp
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      auto_tls:
                        type: boolean
                      custom_domain:
                        type: string
                      id:
                        type: integer
                      name:
                        type: string
                      node_id:
                        type: integer
                      status:
                        type: string
                      type:
                        type: string
                    required:
                      - auto_tls
                      - custom_domain
                      - id
                      - name
                      - node_id
                      - status
                      - type
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: Auto TLS 已开启
                data:
                  auto_tls: true
                  custom_domain: 114514.com
                  id: 20
                  name: 4861097abed145b78cd7caadb9433239
                  node_id: 1
                  status: inactive
                  type: http
          headers: {}
      security: []
  /user/frpc/config:
    get:
      summary: 获取 frpc config
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: tunnel
          in: query
          description: ''
          required: false
          example: 946978624732161e390349
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      config:
                        type: string
                      lolia_config:
                        type: string
                    required:
                      - config
                required:
                  - code
                  - msg
                  - data
          headers: {}
      security: []
  /tunnel/frpc/config:
    get:
      summary: token 获取 frpc config（无需 oauth 凭据）
      deprecated: false
      description: ''
      tags: []
      parameters:
        - name: token
          in: query
          description: ''
          required: false
          example: 114514asdfghjkl
          schema:
            type: string
        - name: id
          in: query
          description: ''
          required: false
          example: '1'
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      config:
                        type: string
                      node_name:
                        type: string
                      tunnel_remark:
                        type: string
                    required:
                      - config
                      - node_name
                      - tunnel_remark
                required:
                  - code
                  - msg
                  - data
          headers: {}
      security: []
  /user/domain:
    get:
      summary: 获取域名列表
      deprecated: false
      description: ''
      tags: []
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      domains:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            domain:
                              type: string
                            is_verified:
                              type: boolean
                            status:
                              type: string
                            verification_subdomain:
                              type: string
                            verification_token:
                              type: string
                            domain_connect_url:
                              type: string
                            has_beian:
                              type: boolean
                            expires_at:
                              type: string
                            created_at:
                              type: string
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                    required:
                      - domains
                      - total
                      - page
                      - limit
                required:
                  - code
                  - msg
                  - data
              example:
                code: 200
                msg: 获取成功
                data:
                  domains:
                    - id: 9
                      domain: awa.fan
                      is_verified: false
                      status: pending
                      verification_subdomain: lolia_bvglr4b7.awa.fan
                      verification_token: zdy2mfgq0z933wb6
                      domain_connect_url: >-
